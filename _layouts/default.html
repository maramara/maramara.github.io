<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon.png">
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="IzPGM6Wu4GKbua5PpXYHBZnq2gQ9idyE5ZlEpaLG6mM" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <h1 class="site-title">{{ page.title | default: site.title }}</h1>
            {% if page.description %}
            <p class="site-tagline">{{ page.description }}</p>
            {% endif %}
            {% if page.hint %}
            <p class="site-hint">{{ page.hint }}</p>
            {% endif %}
        </header>

        <main class="main-content">
            {{ content }}
        </main>

        <footer class="site-footer">
            {% include social.html %}
        </footer>
    </div>
</body>
</html>
