---
layout: default
---

<section class="section">
    {{ content }}
</section>

<hr>

<section class="section">
    <p class="section-label">What I bring</p>

    <div class="skills-grid">
        {% for skill in site.data.skills %}
        <div class="skill-block">
            <h4>{{ skill.title }}</h4>
            <ul>
                {% for item in skill.list %}
                <li>{{ item.title }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}
    </div>
</section>
