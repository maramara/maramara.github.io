---
layout: default
---

<div class="page-404">
    <div id="image-load"></div>
    <br>
    {{ content }}
</div>

<script>
    var images = ['cat1.jpg', 'cat2.jpg', 'cat3.jpg', 'cat4.jpg', 'cat5.jpg', 'cat6.jpg'];
    var img = document.createElement('img');
    img.className = 'thumbnail';
    img.src = '/assets/img/cats/' + images[Math.floor(Math.random() * images.length)];
    img.width = 500;
    document.getElementById('image-load').appendChild(img);
</script>
